<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a5c"/><stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2f3d"/><stop offset="1" stop-color="#0f5f6b"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/><stop offset="1" stop-color="#c9d0db"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3fe0a0" stop-opacity="0.55"/><stop offset="1" stop-color="#3fe0a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- background tile -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <!-- monitor -->
  <g filter="url(#shadow)">
    <path d="M 452 668 L 572 668 L 596 752 L 428 752 Z" fill="#aeb7c4"/>
    <rect x="378" y="742" width="268" height="34" rx="17" fill="url(#bezel)"/>
    <rect x="196" y="236" width="632" height="452" rx="44" fill="url(#bezel)"/>
    <rect x="226" y="266" width="572" height="362" rx="20" fill="url(#scr)"/>
  </g>
  <ellipse cx="512" cy="447" rx="270" ry="170" fill="url(#glow)"/>
  <!-- three chasing arrows: reduce, reuse, recycle -->
  <g>
    <path d="M 539.1 338.3 A 112 112 0 0 1 623.9 450.9" fill="none" stroke="#7df0a8" stroke-width="34" stroke-linecap="round"/>
    <path d="M 663.0 452.3 L 616.6 487.1 L 584.9 449.5 Z" fill="#7df0a8" stroke="#7df0a8" stroke-width="11.9" stroke-linejoin="round"/>
    <path d="M 592.6 524.8 A 112 112 0 0 1 452.6 542.0" fill="none" stroke="#7df0a8" stroke-width="34" stroke-linecap="round"/>
    <path d="M 431.9 575.1 L 425.0 517.5 L 473.4 508.8 Z" fill="#7df0a8" stroke="#7df0a8" stroke-width="11.9" stroke-linejoin="round"/>
    <path d="M 404.3 477.9 A 112 112 0 0 1 459.4 348.1" fill="none" stroke="#7df0a8" stroke-width="34" stroke-linecap="round"/>
    <path d="M 441.1 313.6 L 494.5 336.4 L 477.8 382.6 Z" fill="#7df0a8" stroke="#7df0a8" stroke-width="11.9" stroke-linejoin="round"/>
  </g>
  <!-- data flow: out of the sender, into the receiver -->
  <path d="M 712 430 L 842 430 L 842 403 L 912 447 L 842 491 L 842 464 L 712 464 Z" fill="#7df0a8" stroke="#0b1424" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
</svg>